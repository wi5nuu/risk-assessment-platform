<!-- ==========================================
     1. CONFIRM SIGNUP (Already provided, but included for completeness)
     ========================================== -->
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Your Signup</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header {
            background-color: #0f172a;
            padding: 40px 20px;
            text-align: center;
        }

        .logo {
            width: 48px;
            height: 48px;
            background-color: #3b82f6;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 16px;
        }

        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }

        .content {
            padding: 40px 32px;
            text-align: center;
        }

        .content h2 {
            font-size: 20px;
            font-weight: 600;
            color: #0f172a;
            margin-top: 0;
        }

        .content p {
            color: #475569;
            margin-bottom: 32px;
        }

        .button {
            display: inline-block;
            background-color: #3b82f6;
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
        }

        .footer {
            padding: 24px 32px;
            background-color: #f1f5f9;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="margin-top: 8px;">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
            </div>
            <h1>Risk Assessment Platform</h1>
        </div>
        <div class="content">
            <h2>Confirm your account</h2>
            <p>Thank you for signing up. Please confirm your email address to activate your account and access the
                platform.</p>
            <a href="{{ .ConfirmationURL }}" class="button">Confirm Email Address</a>
        </div>
        <div class="footer">
            <p>If you didn't request this email, you can safely ignore it.</p>
            <p style="margin-top: 12px;">&copy; 2026 Risk Assessment Platform.</p>
        </div>
    </div>
</body>

</html>
